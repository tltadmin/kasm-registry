name: Build Mousepad Noble

on:
  workflow_dispatch:

  push:
    branches:
      - "1.1"
    paths:
      - "images/mousepad-noble/**"
      - ".github/workflows/build-mousepad-noble.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tltadmin/kasm-mousepad-noble

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Mousepad Noble
        uses: docker/build-push-action@v6
        with:
          context: ./images/mousepad-noble
          file: ./images/mousepad-noble/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ghcr.io/tltadmin/kasm-mousepad-noble:1.19.0
            ghcr.io/tltadmin/kasm-mousepad-noble:latest
          labels: |
            org.opencontainers.image.source=https://github.com/tltadmin/kasm-registry
            org.opencontainers.image.description=Mousepad on Ubuntu Noble for Kasm Workspaces
